const state = {
  filter: 'all',
  activeIndex: -1,
  lang: 'en',
};

function srcText(src) { return state.lang === 'pl' && src.text_pl ? src.text_pl : src.text || ''; }
function srcNote(src) { return state.lang === 'pl' && src.note_pl ? src.note_pl : src.note || ''; }

function toggleLang() {
  state.lang = state.lang === 'en' ? 'pl' : 'en';
  document.getElementById('langBtn').textContent = state.lang === 'en' ? 'PL' : 'EN';
  // Re-render current detail view
  const items = getFilteredItems();
  if (state.activeIndex >= 0 && state.activeIndex < items.length) {
    const item = items[state.activeIndex];
    if (item.kind === 'disagreement') showDisagreement(item.data);
    else showOrphan(item.data, item.kind);
  }
}

function init() {
  const s = __DATA.summary;
  
  // Summary chips
  const chips = document.getElementById('summaryChips');
  chips.innerHTML = [
    { type: 'agreed', label: 'Agreed', count: s.agreed },
    { type: 'split', label: 'Splits', count: s.split },
    { type: 'merge', label: 'Merges', count: s.merge },
    { type: 'complex', label: 'Complex', count: s.complex },
    { type: 'orphan', label: 'Orphans', count: s.a_orphans + s.b_orphans },
  ].map(c => `<div class="chip ${c.type}"><span class="dot"></span><span class="count">${c.count.toLocaleString()}</span> ${c.label}</div>`).join('');
  
  // Type tabs
  const tabs = document.getElementById('typeTabs');
  const disagreeCount = s.split + s.merge + s.complex;
  const orphanCount = s.a_orphans + s.b_orphans;
  tabs.innerHTML = [
    { type: 'all', label: `All (${disagreeCount + orphanCount})`, cls: 't-all' },
    { type: 'split', label: `Splits (${s.split})`, cls: 't-split' },
    { type: 'merge', label: `Merges (${s.merge})`, cls: 't-merge' },
    { type: 'complex', label: `Complex (${s.complex})`, cls: 't-complex' },
    { type: 'orphan', label: `Orphans (${orphanCount})`, cls: 't-orphan' },
  ].filter(t => t.type === 'all' || (t.type === 'orphan' ? orphanCount > 0 : s[t.type] > 0))
   .map(t => `<div class="type-tab ${t.cls}${t.type === 'all' ? ' active' : ''}" data-type="${t.type}">${t.label}</div>`)
   .join('');
  
  tabs.querySelectorAll('.type-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      state.filter = tab.dataset.type;
      state.activeIndex = -1;
      renderList();
    });
  });
  
  renderList();
}

function getFilteredItems() {
  const items = [];
  
  // Disagreements
  for (let i = 0; i < __DATA.disagreements.length; i++) {
    const d = __DATA.disagreements[i];
    if (state.filter === 'all' || state.filter === d.type) {
      items.push({ kind: 'disagreement', index: i, data: d });
    }
  }
  
  // Orphans
  if (state.filter === 'all' || state.filter === 'orphan') {
    for (let i = 0; i < __DATA.a_orphans.length; i++) {
      items.push({ kind: 'orphan-a', index: i, data: __DATA.a_orphans[i] });
    }
    for (let i = 0; i < __DATA.b_orphans.length; i++) {
      items.push({ kind: 'orphan-b', index: i, data: __DATA.b_orphans[i] });
    }
  }
  
  return items;
}

function renderList() {
  const list = document.getElementById('itemList');
  const items = getFilteredItems();
  
  list.innerHTML = items.map((item, idx) => {
    if (item.kind === 'disagreement') {
      const d = item.data;
      const na = d.a.length;
      const nb = d.b.length;
      let detail = '';
      if (d.type === 'split') detail = `1 in A → ${nb} in B · ${d.n_claims} claims`;
      else if (d.type === 'merge') detail = `${na} in A → 1 in B · ${d.n_claims} claims`;
      else detail = `${na} in A ↔ ${nb} in B · ${d.n_claims} claims`;
      
      return `<div class="item t-${d.type}${state.activeIndex === idx ? ' active' : ''}" onclick="selectItem(${idx})">
        <div class="item-type ${d.type}">${d.type}</div>
        <div class="item-name">${esc(d.name)}</div>
        <div class="item-detail">${detail}</div>
      </div>`;
    } else {
      const o = item.data;
      const side = item.kind === 'orphan-a' ? 'A' : 'B';
      const dates = [o.birth ? `b. ${o.birth}` : '', o.death ? `d. ${o.death}` : ''].filter(Boolean).join(' — ');
      return `<div class="item t-${item.kind}${state.activeIndex === idx ? ' active' : ''}" onclick="selectItem(${idx})">
        <div class="item-type orphan">only in ${side}</div>
        <div class="item-name">${esc(o.name)}</div>
        <div class="item-detail">${dates}${o.n_claims ? ` · ${o.n_claims} claims` : ''}</div>
      </div>`;
    }
  }).join('');
}

function selectItem(idx) {
  state.activeIndex = idx;
  renderList();
  
  const items = getFilteredItems();
  const item = items[idx];
  if (!item) return;
  
  if (item.kind === 'disagreement') {
    showDisagreement(item.data);
  } else {
    showOrphan(item.data, item.kind);
  }
}

function showDisagreement(d) {
  const main = document.getElementById('mainContent');
  const na = d.a.length;
  const nb = d.b.length;
  
  let typeLabel = d.type;
  let subtitle = '';
  if (d.type === 'split') subtitle = `Version A has 1 individual; version B has ${nb}`;
  else if (d.type === 'merge') subtitle = `Version A has ${na} individuals; version B has 1`;
  else subtitle = `Version A has ${na} individuals; version B has ${nb}`;
  
  let html = `
    <div class="comp-header">
      <div class="comp-type ${d.type}">${typeLabel}</div>
      <div class="comp-title">${esc(d.name)}</div>
      <div class="comp-subtitle">${subtitle} · ${d.n_claims} shared claims</div>
    </div>
    
    <div class="versus">
      <div class="ver-panel side-a">
        <div class="ver-label">${esc(__DATA.name_a)}</div>
        ${d.a.map(p => personCard(p)).join('')}
      </div>
      <div class="ver-panel side-b">
        <div class="ver-label">${esc(__DATA.name_b)}</div>
        ${d.b.map(p => personCard(p)).join('')}
      </div>
    </div>`;
  
  // Claim flow table — simple one-line-per-claim with color-coded individuals
  if (d.claims.length > 0) {
    const aNames = {};
    d.a.forEach(p => aNames[p.xref] = p.name);
    const bNames = {};
    d.b.forEach(p => bNames[p.xref] = p.name);
    
    const groupColors = ['#d4a855','#6a9fcc','#b07ab0','#5a8a5a','#cc7a8a','#7bc47c','#c4756a','#8ac','#c96','#9b9'];
    
    // Assign colors to the "many" side
    const aColorMap = {};
    const bColorMap = {};
    d.a.forEach((p, i) => aColorMap[p.xref] = d.a.length > 1 ? groupColors[i % groupColors.length] : 'var(--ver-a)');
    d.b.forEach((p, i) => bColorMap[p.xref] = d.b.length > 1 ? groupColors[i % groupColors.length] : 'var(--ver-b)');
    
    html += `<div class="flow-section">
      <h3>Claim Flow</h3>
      <table class="flow-table">
        <tr>
          <th>Source Record</th>
          <th>Claim</th>
          <th>Role</th>
          <th style="color:var(--ver-a)">${esc(__DATA.name_a)}</th>
          <th style="color:var(--ver-b)">${esc(__DATA.name_b)}</th>
        </tr>`;
    
    for (const c of d.claims) {
      const aName = aNames[c.a_xref] || c.a_xref;
      const bName = bNames[c.b_xref] || c.b_xref;
      const aColor = aColorMap[c.a_xref] || 'var(--ver-a)';
      const bColor = bColorMap[c.b_xref] || 'var(--ver-b)';
      html += `<tr>
        <td class="col-page">${esc(c.page)}</td>
        <td class="col-name">${esc(c.claimname)}</td>
        <td style="color:var(--text-dim);font-size:11px;">${esc(c.claimrole || '')}</td>
        <td style="color:${aColor}">${esc(aName)}</td>
        <td style="color:${bColor}">${esc(bName)}</td>
      </tr>`;
    }
    
    html += `</table></div>`;
  }
  
  main.innerHTML = html;
}

function showOrphan(o, kind) {
  const main = document.getElementById('mainContent');
  const side = kind === 'orphan-a' ? 'A' : 'B';
  const verName = kind === 'orphan-a' ? __DATA.name_a : __DATA.name_b;
  const dates = [o.birth ? `b. ${o.birth}` : '', o.death ? `d. ${o.death}` : ''].filter(Boolean).join(' — ');
  
  let html = `
    <div class="comp-header">
      <div class="comp-type orphan">Only in ${side}</div>
      <div class="comp-title">${esc(o.name)}</div>
      <div class="comp-subtitle">${dates} · ${o.n_claims} claims · present in ${esc(verName)} only</div>
    </div>
    <div class="flow-section">
      <h3>Source Records</h3>`;
  
  if (o.sources && o.sources.length > 0) {
    html += `<div class="pc-sources">`;
    for (const src of o.sources) {
      html += `<div class="pc-source">`;
      if (src.claimrole) html += `<div class="src-role">${esc(src.claimrole)}</div>`;
      if (src.page) html += `<div class="src-page">${esc(src.page)}</div>`;
      const text = srcText(src);
      if (text) html += `<div class="src-text">${esc(text)}</div>`;
      const note = srcNote(src);
      if (note) html += `<div class="src-note">${esc(note)}</div>`;
      if (src.url || src.scan_url) {
        html += `<div class="src-links">`;
        if (src.url) html += `<a href="${esc(src.url)}" target="_blank" rel="noopener">record</a>`;
        if (src.scan_url) html += `<a href="${esc(src.scan_url)}" target="_blank" rel="noopener">scan</a>`;
        html += `</div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  } else {
    html += `<p style="color:var(--text-dim)">No source records.</p>`;
  }
  
  html += `</div>`;
  main.innerHTML = html;
}

function personCard(p) {
  const sexClass = p.sex === 'M' ? 'male' : p.sex === 'F' ? 'female' : '';
  const dates = [p.birth ? `b. ${p.birth}` : '', p.death ? `d. ${p.death}` : ''].filter(Boolean).join(' — ');
  const claimInfo = p.n_unmatched > 0 
    ? `<span class="matched">${p.n_matched} matched</span>, <span class="unmatched">${p.n_unmatched} unmatched</span>`
    : `${p.n_claims} claims`;
  
  let sourcesHtml = '';
  if (p.sources && p.sources.length > 0) {
    sourcesHtml = `<div class="pc-sources">`;
    for (const src of p.sources) {
      const unmatchedClass = src.matched ? '' : ' unmatched-src';
      sourcesHtml += `<div class="pc-source${unmatchedClass}">`;
      if (src.claimrole) sourcesHtml += `<div class="src-role">${esc(src.claimrole)}</div>`;
      if (src.page) sourcesHtml += `<div class="src-page">${esc(src.page)}</div>`;
      const text = srcText(src);
      if (text) sourcesHtml += `<div class="src-text">${esc(text)}</div>`;
      const note = srcNote(src);
      if (note) sourcesHtml += `<div class="src-note">${esc(note)}</div>`;
      if (src.url || src.scan_url) {
        sourcesHtml += `<div class="src-links">`;
        if (src.url) sourcesHtml += `<a href="${esc(src.url)}" target="_blank" rel="noopener">record</a>`;
        if (src.scan_url) sourcesHtml += `<a href="${esc(src.scan_url)}" target="_blank" rel="noopener">scan</a>`;
        sourcesHtml += `</div>`;
      }
      sourcesHtml += `</div>`;
    }
    sourcesHtml += `</div>`;
  }
  
  return `<div class="person-card">
    <div class="pc-name ${sexClass}">${esc(p.name)} <span style="font-family:var(--ui);font-size:11px;color:var(--text-dim);font-weight:400;">${esc(p.xref)}</span></div>
    <div class="pc-dates">${esc(dates)}</div>
    <div class="pc-claims">${claimInfo}</div>
    ${sourcesHtml}
  </div>`;
}

function esc(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

init();
</script>
</body>
</html>
